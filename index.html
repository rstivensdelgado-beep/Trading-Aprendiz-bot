<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tutor de Trading</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--mut:var(--tg-theme-hint-color,#7a7a7a);--bt:var(--tg-theme-button-color,#2481cc);--bx:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f0f2f5);--up:#16a34a;--dn:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
nav{display:flex;gap:6px;padding:10px;position:sticky;top:0;background:var(--bg);z-index:2}
nav button,.seg button{flex:1;border:0;border-radius:10px;padding:9px 4px;background:var(--card);color:var(--tx);font:inherit;font-size:13px}
nav button.on,.seg button.on{background:var(--bt);color:var(--bx)}
main{padding:0 12px 24px;max-width:640px;margin:auto}
.panel{display:none}.panel.on{display:block}
.seg{display:flex;gap:6px;margin:8px 0}
.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.precio{font-size:26px;font-weight:700}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut);font-size:12px}
canvas{width:100%;height:260px;display:block}
label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mut)}
[hidden]{display:none!important}
nav{overflow-x:auto}nav button{flex:1 0 auto;white-space:nowrap;padding:9px 12px}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg)}
.mini{border:0;border-radius:8px;padding:4px 10px;background:var(--bt);color:var(--bx);font:inherit;font-size:12px}
input:not([type=checkbox]){width:100%;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--tx);font:inherit}
.btn{width:100%;margin-top:10px;border:0;border-radius:10px;padding:11px;background:var(--bt);color:var(--bx);font:inherit}
.res div{display:flex;justify-content:space-between;padding:4px 0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.chk input{width:20px;height:20px;margin-top:2px}
dt{font-weight:600;margin-top:10px}dd{margin:2px 0 0;color:var(--mut)}
.ov{position:fixed;inset:0;background:#000b;z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}.ov .card{width:100%;max-width:420px}
details summary{cursor:pointer;font-weight:600}details p{color:var(--mut)}.g2{display:flex;gap:8px}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--tx);font:inherit}.g2>div{flex:1}.g2 .btn{margin-top:10px}
.lec{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bg)}.lec b{flex:1;font-weight:600}
.num{width:26px;height:26px;border-radius:50%;background:var(--bt);color:var(--bx);display:grid;place-items:center;font-size:12px;flex:none}.num.okk{background:var(--up)}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--up)}
.ejem{border-left:3px solid var(--bt);padding:6px 10px;margin:10px 0}.rec{background:var(--bg);border-radius:8px;padding:8px 10px;margin:10px 0}
svg.fig{width:100%;height:auto;display:block;margin:6px 0 10px}.fig .t{fill:var(--tx);font:11px system-ui}.fig .m{fill:var(--mut);font:10px system-ui}
.btn:disabled{opacity:.4}
</style>
</head>
<body>
<nav id="tabs">
  <button data-p="graf" class="on">📈 Gráfico</button>
  <button data-p="sim">💼 Simulador</button>
  <button data-p="calc">📐 Tamaño</button>
  <button data-p="chk">✅ Checklist</button>
  <button data-p="pra">🎯 Práctica</button><button data-p="les">📘 Lecciones</button><button data-p="qz">❓ Quiz</button><button data-p="rl">🧪 Riesgo</button><button data-p="ds">🛡️ Disciplina</button><button data-p="cs">🧠 Casos</button><button data-p="glo">📖 Glosario</button>
</nav>
<main>

<section id="graf" class="panel on">
  <div class="seg" id="activos"><button data-a="BTC" class="on">BTC</button><button data-a="XAU">Oro (XAU)</button></div>
  <div class="seg" id="rangos"><button data-d="1">1d</button><button data-d="7">7d</button><button data-d="30" class="on">30d</button><button data-d="90">90d</button></div>
  <div class="seg" id="inds"><button data-i="sma">Media móvil 20</button><button data-i="rsi">RSI 14</button></div>
  <div class="card">
    <div class="precio" id="px">…</div>
    <div id="chg" class="mut"></div>
    <canvas id="cv"></canvas><canvas id="cvr" style="height:80px" hidden></canvas><div class="mut">▲ compras y ▼ ventas se marcan solas. Toca el gráfico para trazar una línea (púrpura); toca cerca de ella para borrarla.</div>
    <div id="estado" class="mut"></div><label class="chk"><input type="checkbox" id="ahorro"><span style="color:var(--tx)">📶 Modo ahorro de datos</span></label><div id="uso" class="mut"></div>
  </div>
  <div class="mut">El oro se calcula con PAXG (oro tokenizado): es una referencia aproximada. Confirma el precio antes de registrar tu operación.</div>
</section>

<section id="sim" class="panel">
  <div class="card" id="s_res"></div>
  <div class="seg" id="sub"><button data-s="op" class="on">Operar</button><button data-s="dia">Diario</button><button data-s="pat">Patrones</button><button data-s="est">Stats</button></div>
  <div id="s_op">
    <div class="card">
      <label>Activo</label><input id="s_sym" list="activos_l" value="BTC"><datalist id="activos_l"><option value="BTC"><option value="XAU"></datalist>
      <label>Cantidad</label><input id="s_cant" type="number" inputmode="decimal">
      <label>Precio</label><input id="s_px" type="number" inputmode="decimal">
      <button class="btn" id="s_usar" style="background:var(--bg);color:var(--tx);border:1px solid var(--mut)">Usar precio actual</button>
      <label>Stop loss (obligatorio)</label><input id="s_stp" type="number" inputmode="decimal"><label>Objetivo / take profit (obligatorio)</label><input id="s_obj" type="number" inputmode="decimal"><div id="s_rr" class="mut" style="margin-top:6px"></div>
      <label>Razón (con etiquetas: #ruptura #soporte #rsi)</label><input id="s_raz" type="text"><label>¿Cómo te sientes al entrar?</label><select id="s_em"><option>😌 Calmado</option><option>😰 Miedo</option><option>🤩 Euforia</option><option>😡 Rabia</option></select>
      <div style="display:flex;gap:8px"><button class="btn" id="s_buy" style="background:var(--up)">Comprar</button><button class="btn" id="s_sell" style="background:var(--dn)">Vender</button></div>
      <div id="s_msg" class="mut" style="margin-top:8px"></div>
    </div>
    <div class="card" id="s_pos"></div>
    <button class="btn" id="s_reset" style="background:var(--card);color:var(--dn)">Reiniciar simulador</button>
  </div>
  <div id="s_dia" hidden></div>
  <div id="s_pat" hidden></div>
  <div id="s_est" hidden></div>
</section>

<section id="calc" class="panel">
  <div class="card">
    <label>Capital ($)</label><input id="cap" type="number" inputmode="decimal" value="10000">
    <label>Riesgo por operación (%)</label><input id="rie" type="number" inputmode="decimal" value="1">
    <label>Precio de entrada</label><input id="ent" type="number" inputmode="decimal">
    <label>Stop loss (debajo de la entrada)</label><input id="stp" type="number" inputmode="decimal">
    <button class="btn" id="usar">Usar el precio actual como entrada</button>
  </div>
  <div class="card res" id="res"><span class="mut">Escribe entrada y stop para calcular.</span></div>
</section>

<section id="chk" class="panel">
  <div class="card" id="lista"></div>
  <div class="card" id="veredicto"></div>
  <button class="btn" id="reset">Reiniciar checklist</button>
</section>

<section id="glo" class="panel">
  <input id="buscar" type="search" placeholder="Buscar término…">
  <dl id="terminos"></dl><button class="btn" id="vtut">👋 Ver tutorial</button>
</section>

<section id="pra" class="panel">
  <div class="card"><b id="p_t">Cargando…</b><canvas id="cvp"></canvas><div id="p_i" class="mut"></div></div>
  <div class="card">
    <div class="g2"><div><label>Activo</label><select id="p_a"><option>BTC</option><option>XAU</option></select></div><div><label>Velas de</label><select id="p_d"><option value="30">4 horas</option><option value="365">4 días</option></select></div></div>
    <label class="chk"><input type="checkbox" id="p_h"><span style="color:var(--tx)">Sin indicadores (modo experto)</span></label>
    <div class="g2"><div><label>Stop %</label><input id="p_sl" type="number" inputmode="decimal" value="2"></div><div><label>Objetivo %</label><input id="p_tp" type="number" inputmode="decimal" value="4"></div><div><label>Riesgo %</label><input id="p_rk" type="number" inputmode="decimal" value="1"></div></div>
    <label>Razón de entrada</label><select id="p_tg"><option>#ruptura</option><option>#soporte</option><option>#rsi</option><option>#tendencia</option><option>#otra</option></select>
    <div class="g2"><button class="btn" id="p_b" style="background:var(--up)">▲ Comprar</button><button class="btn" id="p_k" style="background:var(--dn)">▼ Corto</button></div>
    <div class="g2"><button class="btn" data-w="1">▶ 1</button><button class="btn" data-w="5">▶ 5</button><button class="btn" data-w="10">▶ 10</button><button class="btn" id="p_c" style="background:var(--dn)">Cerrar</button></div>
    <div class="g2"><button class="btn" id="p_n" style="background:var(--card);color:var(--tx)">🔀 Nuevo tramo</button><button class="btn" id="p_e" style="background:var(--card);color:var(--tx)">🏁 Terminar</button></div>
  </div>
  <div class="card" id="p_f" hidden></div><div class="card" id="p_sm" hidden></div>
  <div class="card" id="p_r"></div><div class="card" id="p_ch"></div>
</section>
<section id="les" class="panel"></section>
<section id="qz" class="panel"></section>
<section id="rl" class="panel">
  <div class="seg" id="rl_sub"><button data-s="r" class="on">🎲 Rachas</button><button data-s="c">⚖️ Comparar</button><button data-s="x">📉 Recuperar</button></div>
  <div class="card" id="rl_in">
    <div class="g2"><div><label>Aciertos (%)</label><input id="rl_w" type="number" inputmode="decimal" value="40"></div><div><label>Beneficio / riesgo</label><input id="rl_rr" type="number" inputmode="decimal" value="2"></div></div>
    <div class="g2"><div><label>Riesgo por operación (%)</label><input id="rl_rk" type="number" inputmode="decimal" value="1"></div><div><label>Nº de operaciones</label><input id="rl_n" type="number" inputmode="decimal" value="100"></div></div>
    <button class="btn" id="rl_go">🎲 Simular</button>
  </div>
  <div id="rl_out"></div>
</section>
<section id="ds" class="panel"></section>
<section id="cs" class="panel"></section>

</main>
<div id="tut" class="ov" hidden></div>
<script>
const $=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();}catch(e){}}
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const f=(n,d)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d??(Math.abs(n)<10?4:2)});

// ---------- Pestañas ----------
$('tabs').onclick=e=>{
  const p=e.target.dataset.p; if(!p)return;
  document.querySelectorAll('nav button,.panel').forEach(x=>x.classList.remove('on'));
  e.target.classList.add('on'); $(p).classList.add('on');
  if(p==='graf')dibujar();
  if(p==='sim')pintarSim();
  if(p==='les')pintarLes();if(p==='qz')pintarQz();if(p==='rl')pintarRl();if(p==='ds')pintarDs();if(p==='cs')pintarCs();
  if(p==='pra'){P?pDib():pNueva();}
};

// ---------- Gráfico de velas ----------
const IDS={BTC:'bitcoin',XAU:'pax-gold'};
let activo='BTC',dias=30,datos=[];
function seg(id,attr,fn){
  $(id).onclick=e=>{const v=e.target.dataset[attr];if(!v)return;
    $(id).querySelectorAll('button').forEach(b=>b.classList.remove('on'));
    e.target.classList.add('on');fn(v);cargar();};
}
seg('activos','a',v=>activo=v);
seg('rangos','d',v=>dias=+v);

async function cargar(){
  const k=`ohlc_${activo}_${dias}`,c=store.get(k);
  let hora,viejo=false;
  if(c&&(ahorro||Date.now()-c.t<600000)){datos=c.d;hora=c.t;}      // caché 10 min: ahorra datos
  else{
    $('estado').textContent='Cargando…';
    try{
      const r=await fetch(`https://api.coingecko.com/api/v3/coins/${IDS[activo]}/ohlc?vs_currency=usd&days=${dias}`);
      if(!r.ok)throw new Error(r.status);
      const tx=await r.text();uso(tx.length);datos=JSON.parse(tx);hora=Date.now();store.set(k,{t:hora,d:datos});
    }catch(e){
      if(c){datos=c.d;hora=c.t;viejo=true;}
      else{datos=[];$('px').textContent='Sin datos';$('chg').textContent='';
        $('estado').textContent='No se pudo conectar. Inténtalo más tarde.';dibujar();return;}
    }
  }
  const h=new Date(hora).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
  $('estado').textContent=viejo?`Sin conexión: datos guardados de las ${h}`:`Actualizado ${h}`;
  const ult=datos[datos.length-1][4],ini=datos[0][1],ch=(ult-ini)/ini*100;
  $('px').textContent='$'+f(ult);
  $('chg').innerHTML=`<span class="${ch>=0?'up':'dn'}">${ch>=0?'▲':'▼'} ${f(Math.abs(ch),2)}%</span> en ${dias===1?'24 horas':dias+' días'}`;
  dibujar();
}

function dibujar(cv=$('cv'),arr=datos,ex={}){
  const W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
  const main=cv.id==='cv';if(main){ex={sma:ind.sma,lines:[],mark:[]};
    const q=sim.pos[activo];if(q&&q.stop)ex.lines.push({v:q.prom,c:'#888'},{v:q.stop,c:'#dc2626'},{v:q.obj,c:'#16a34a'});
    (store.get('lin_'+activo)||[]).forEach(v=>ex.lines.push({v,c:'#a855f7'}));
    sim.diario.forEach(e=>{if(e.sym!==activo||!e.t)return;let k=-1;arr.forEach((c,i)=>{if(c[0]<=e.t)k=i});if(k<0)return;
      ex.mark.push({i:k,p:e.precio,t:e.tipo==='COMPRA'?'▲':'▼',c:e.tipo==='COMPRA'?'#2481cc':e.pnl>=0?'#16a34a':'#dc2626'})});}
  const dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  if(!arr.length)return;
  const mut=getComputedStyle(document.documentElement).getPropertyValue('--mut').trim()||'#888';
  const pad={l:4,r:58,t:8,b:8},L=ex.lines||[],S=ex.sma?SMA(arr,20):[];
  let hi=Math.max(...arr.map(c=>c[2]),...L.map(l=>l.v)),lo=Math.min(...arr.map(c=>c[3]),...L.map(l=>l.v));
  const m=(hi-lo)*.06||1;hi+=m;lo-=m;
  const Y=v=>pad.t+(hi-v)/(hi-lo)*(H-pad.t-pad.b);cv._m=[hi,lo,pad.t,H-pad.b];
  x.font='11px system-ui';x.fillStyle=mut;x.strokeStyle=mut;x.globalAlpha=.25;
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);
    x.beginPath();x.moveTo(pad.l,y);x.lineTo(W-pad.r,y);x.stroke();
    x.globalAlpha=1;x.fillText(f(v,v<10?3:0),W-pad.r+4,y+4);x.globalAlpha=.25;}
  x.globalAlpha=1;
  const cw=(W-pad.l-pad.r)/arr.length;
  arr.forEach((c,i)=>{
    const [,o,h,l,cl]=c,px=pad.l+i*cw+cw/2,col=cl>=o?'#16a34a':'#dc2626';
    x.strokeStyle=x.fillStyle=col;
    x.beginPath();x.moveTo(px,Y(h));x.lineTo(px,Y(l));x.stroke();
    const top=Y(Math.max(o,cl)),bh=Math.max(1,Math.abs(Y(o)-Y(cl)));
    x.fillRect(px-cw*.35,top,cw*.7,bh);
  });
  if(ex.sma){x.strokeStyle='#f59e0b';x.lineWidth=2;x.beginPath();let k=0;S.forEach((v,i)=>{if(v==null)return;const px=pad.l+i*cw+cw/2;k++?x.lineTo(px,Y(v)):x.moveTo(px,Y(v))});x.stroke();x.lineWidth=1}
  L.forEach(l=>{x.strokeStyle=x.fillStyle=l.c;x.setLineDash([5,4]);x.beginPath();x.moveTo(pad.l,Y(l.v));x.lineTo(W-pad.r,Y(l.v));x.stroke();x.setLineDash([]);x.fillText(f(l.v,l.v<10?3:0),W-pad.r+4,Y(l.v)+4)});
  (ex.mark||[]).forEach(k=>{if(k.i<0)return;x.fillStyle=k.c;x.font='14px system-ui';x.fillText(k.t,pad.l+k.i*cw+cw/2-5,Y(k.p)+5)});
  if(main)dRSI();
}
window.addEventListener('resize',()=>{dibujar();pDib();});

// ---------- Simulador ----------
const CAP0=10000;
const nuevoSim=()=>({cash:CAP0,pos:{},hist:[],ganadas:0,perdidas:0,pnl:0,diario:[],etiquetas:{}});
let sim=store.get('sim')||nuevoSim();
const guardar=()=>store.set('sim',sim);
const ahora=()=>new Date().toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const cls=n=>n>=0?'up':'dn',sg=n=>(n>=0?'+':'-')+'$'+f(Math.abs(n));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const confirmar=(t,fn)=>{try{if(tg&&tg.showConfirm)return tg.showConfirm(t,ok=>ok&&fn());}catch(e){}if(confirm(t))fn();};

async function precios(){
  const c=store.get('precios');
  if(c&&(ahorro||Date.now()-c.t<120000))return c.v;
  try{
    const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,pax-gold&vs_currencies=usd');
    if(!r.ok)throw 0;const j=await r.json();
    const v={BTC:j.bitcoin.usd,XAU:j['pax-gold'].usd};store.set('precios',{t:Date.now(),v});return v;
  }catch(e){return c?c.v:{};}
}

async function pintarSim(){
  const p=await precios();let val=0,flot=0,filas='';
  for(const [s,x] of Object.entries(sim.pos)){
    const px=p[s],fl=px?(px-x.prom)*x.cant:null;
    val+=x.cant*(px||x.prom);if(fl!==null)flot+=fl;
    filas+=`<div class="row"><span><b>${esc(s)}</b> ${+x.cant.toPrecision(6)}<br><span class="mut">prom $${f(x.prom)}${px?' · ahora $'+f(px):''}${x.stop?`<br>SL $${f(x.stop)} · TP $${f(x.obj)}`:''}${px&&x.stop&&px<=x.stop?' <b class="dn">⚠️ tocó stop</b>':px&&x.obj&&px>=x.obj?' <b class="up">🎯 objetivo</b>':''}</span></span><span style="text-align:right">${fl!==null?`<b class="${cls(fl)}">${sg(fl)}</b><br>`:''}<button class="mini" data-v="${esc(s)}">Vender</button></span></div>`;
  }
  const n=sim.ganadas+sim.perdidas;
  $('s_res').innerHTML=`<div class="row"><span>Efectivo</span><b>$${f(sim.cash)}</b></div>
   <div class="row"><span>Posiciones</span><b>$${f(val)}</b></div>
   <div class="row"><span>Capital total</span><b>$${f(sim.cash+val)}</b></div>
   <div class="row"><span>Ganancia flotante</span><b class="${cls(flot)}">${sg(flot)}</b></div>
   <div class="row"><span>Resultado cerrado</span><b class="${cls(sim.pnl)}">${sg(sim.pnl)}</b></div>
   <div class="row"><span>Aciertos</span><b>${n?`${sim.ganadas}/${n} (${Math.round(100*sim.ganadas/n)}%)`:'—'}</b></div>`;
  $('s_pos').innerHTML=filas?`<b>Posiciones abiertas</b>${filas}`:'<span class="mut">No tienes posiciones abiertas.</span>';
}

function operar0(tipo){
  const sym=$('s_sym').value.trim().toUpperCase(),cant=+$('s_cant').value,px=+$('s_px').value,razon=$('s_raz').value.trim(),m=$('s_msg');
  const err=t=>{m.className='dn';m.textContent=t;};
  if(!sym||!(cant>0)||!(px>0))return err('Completa activo, cantidad y precio.');
  m.className='mut';
  if(tipo==='COMPRA'){
    const costo=cant*px;
    if(costo>sim.cash)return err(`Te faltan fondos: necesitas $${f(costo)} y tienes $${f(sim.cash)}.`);
    const p=sim.pos[sym]||{cant:0,prom:0,razon:''},tot=p.cant+cant;
    p.prom=(p.cant*p.prom+cant*px)/tot;p.cant=tot;if(razon)p.razon=razon;p.stop=+$('s_stp').value;p.obj=+$('s_obj').value;
    sim.pos[sym]=p;sim.cash-=costo;

function calcular(){
  const cap=+$('cap').value,rp=+$('rie').value,en=+$('ent').value,st=+$('stp').value;
  const r=$('res');
  if(!(cap>0&&rp>0&&en>0&&st>0)){r.innerHTML='<span class="mut">Escribe entrada y stop para calcular.</span>';return;}
  if(st>=en){r.innerHTML='<span class="dn">El stop debe estar por debajo de la entrada.</span>';return;}
  const riesgo=cap*rp/100,dist=en-st,cant=riesgo/dist,costo=cant*en;
  let h=`<div><span>Riesgo</span><b>$${f(riesgo)}</b></div>
   <div><span>Pérdida por unidad</span><b>$${f(dist)}</b></div>
   <div><span>Compra</span><b>${+cant.toPrecision(5)} unidades</b></div>
   <div><span>Costo</span><b>$${f(costo)}</b></div>
   <div><span>Objetivo 1:2</span><b class="up">$${f(en+2*dist)}</b></div>
   <div><span>Objetivo 1:3</span><b class="up">$${f(en+3*dist)}</b></div>`;
  if(costo>cap)h+='<p class="dn">Ese tamaño cuesta más que tu capital.</p>';
  if(rp>2)h+='<p class="dn">Más de 2% por operación es mucho riesgo.</p>';
  r.innerHTML=h;
}

  rv=`Qué habría pasado: en las ${nx.length} velas siguientes el precio llegó de $${f(lN)} a $${f(hN)}. ${ok?'Tu objetivo sí se alcanzaba'+(t.includes('Stop')?': quizás el stop era muy ajustado.':'.'):'Tu objetivo no se alcanzaba.'}`}
 $('p_f').hidden=false;$('p_f').innerHTML=`<b>${g>=0?'🟢':'🔴'} ${t}: ${sg(g)}</b><div>${er.length?er.map(k=>'• '+TXT[k]).join('<br>'):'✅ Entrada ordenada: stop razonable, a favor de la tendencia y con buena relación.'}</div><div class="mut" style="margin-top:6px">${rv}</div>${nu.length?`<div style="margin-top:6px">🏅 ¡Reto cumplido: ${nu.join(', ')}!</div>`:''}`;}
function pPaso(n){if(!P)return;settle();let fin=false;
 for(let k=0;k<n;k++){if(P.i>=P.d.length-1){fin=true;break}
  P.i++;const c=P.d[P.i],q=P.pos;
  if(q){if(q.dir>0?c[3]<=q.sl:c[2]>=q.sl){pCierra(q.sl,'🛑 Stop');break}if(q.dir>0?c[2]>=q.tp:c[3]<=q.tp){pCierra(q.tp,'🎯 Objetivo');break}}}
 pInfo(fin?'Fin de los datos: pulsa Terminar para ver tu resumen.':undefined);pDib();}
function pResumen(){const t=P?P.tr:[],c=$('p_sm');c.hidden=false;
 if(!t.length){c.innerHTML='<b>🏁 Resumen del tramo</b><div class="mut">No hiciste operaciones en este tramo.</div>';return}
 const w=t.filter(x=>x.g>=0).length,pn=t.reduce((q,x)=>q+x.g,0),ec={};t.forEach(x=>x.er.forEach(k=>ec[k]=(ec[k]||0)+1));const top=Object.entries(ec).sort((a,b)=>b[1]-a[1])[0];
 c.innerHTML=`<b>🏁 Resumen del tramo</b><div class="row"><span>Operaciones</span><b>${t.length}</b></div><div class="row"><span>Aciertos</span><b>${w}/${t.length}</b></div><div class="row"><span>Resultado</span><b class="${cls(pn)}">${sg(pn)}</b></div><div class="mut">${top?`Error más repetido: <b>${top[0]}</b> (${top[1]} veces). Trabájalo en el próximo tramo.`:'Sin errores marcados. ¡Muy bien!'}</div>`;}
$('p_b').onclick=()=>pEntra(1);$('p_k').onclick=()=>pEntra(-1);
$('pra').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>pPaso(+b.dataset.w));
$('p_c').onclick=()=>{if(P&&P.pos){settle();pCierra(P.d[P.i][4],'Cerrada');pInfo();pDib()}};
$('p_n').onclick=pNueva;$('p_a').onchange=$('p_d').onchange=pNueva;$('p_h').onchange=pDib;
$('p_e').onclick=()=>{if(P&&P.pos){settle();pCierra(P.d[P.i][4],'Cerrada')}pResumen();pNueva();};

const LEC=[
["Qué es operar","",["Operar (hacer trading) es comprar un activo —cripto, oro, acciones— esperando venderlo más caro. Ganas si el precio se mueve a tu favor y pierdes si se mueve en contra.","La meta no es acertar siempre, sino <b>perder poco cuando fallas y ganar más cuando aciertas</b>."],"Compras 0.01 BTC a $65,000 (costo $650). Si sube a $66,300 ganas $13; si baja a $63,700 pierdes $13.","Puedes perder dinero. Aprende primero en el simulador."],
["Velas japonesas","vela",["Cada vela resume un periodo (una hora, un día…). El <b>cuerpo</b> va de la apertura al cierre y las <b>mechas</b> llegan al máximo y al mínimo.","Verde: cerró más arriba de donde abrió. Roja: cerró más abajo."],"Un activo abre en $100, sube hasta $107, baja a $98 y cierra en $105: vela verde con cuerpo de $5 y mechas hasta $107 y $98.","Cuerpo grande = movimiento fuerte. Una mecha larga suele indicar que el precio fue rechazado en esa zona."],
["Tendencia","tend",["<b>Alcista</b>: máximos y mínimos cada vez más altos. <b>Bajista</b>: cada vez más bajos. <b>Lateral</b>: el precio se mueve en un rango sin dirección.","Operar a favor de la tendencia suele ser más fácil que ir en contra."],"Si en cuatro semanas los mínimos son 60, 62, 64 y 66 mil, hay tendencia alcista: busca compras, no ventas en corto.","Mira primero el gráfico de 30 o 90 días para ver la tendencia antes de decidir."],
["Soporte y resistencia","sr",["<b>Soporte</b>: zona donde el precio suele frenar su caída y rebotar. <b>Resistencia</b>: zona donde suele frenar su subida y devolverse.","Mientras más veces toca una zona sin romperla, más importante es. Si la rompe, a veces el soporte pasa a ser resistencia y al revés."],"BTC rebotó tres veces cerca de $60,000: ahí hay un soporte. Un plan posible: entrar cerca de $60,200 con el stop en $59,500, debajo del soporte.","Son zonas, no líneas exactas. Deja un pequeño margen."],
["Media móvil","media",["Es el promedio de los últimos N cierres. Al recalcularse en cada vela forma una línea suave que muestra la dirección y reduce el ruido.","Precio sobre la media suele indicar fuerza; debajo, debilidad."],"Cierres de 5 días: 10, 12, 11, 13, 14 → media = 60 ÷ 5 = 12. Si el día siguiente cierra en 15, sale el 10 y la media pasa a 65 ÷ 5 = 13.","Llega con retraso: confirma lo que ya pasó, no predice."],
["RSI","rsi",["Mide la fuerza de los últimos movimientos en una escala de 0 a 100. Sobre 70 se considera <b>sobrecompra</b> (subió mucho y rápido); bajo 30, <b>sobreventa</b>."],"Si el RSI de BTC marca 78 tras una subida fuerte, quizá no sea buen momento para comprar. Pero en tendencias fuertes puede quedarse sobre 70 por semanas.","No es una señal automática de giro. Úsalo junto con tendencia, soporte y resistencia."],
["Stop loss","stop",["Es el nivel donde aceptas que te equivocaste y cierras para limitar la pérdida. Defínelo <b>antes</b> de entrar y ponlo en un lugar con sentido: un poco debajo de un soporte, no a una distancia arbitraria."],"Compras en $60,200 con el stop en $59,500: si el soporte se rompe, pierdes $700 por BTC y sales. Sin stop, esa pérdida podría crecer mucho más.","Nunca alejes el stop cuando el precio se acerca."],
["Objetivo y riesgo/beneficio","riesgo",["Antes de entrar compara cuánto puedes perder (hasta el stop) con cuánto puedes ganar (hasta el objetivo). Una relación <b>1:2</b> significa arriesgar 1 para ganar 2."],"Entrada $65,000, stop $63,700 (−$1,300), objetivo $67,600 (+$2,600): relación 1:2. Acertando solo 4 de cada 10: 4×2 = +8 y 6×(−1) = −6, resultado +2 unidades de riesgo.","Busca al menos 1:2. Si el mercado no te lo ofrece, no entres."],
["Tamaño de posición","",["Arriesga solo <b>1–2% de tu capital</b> por operación. Para lograrlo: cantidad = dinero que aceptas perder ÷ distancia entre la entrada y el stop."],"Capital $10,000 → riesgo 1% = $100. Entrada $65,000 y stop $63,700 (distancia $1,300): cantidad = 100 ÷ 1,300 = 0.0769 BTC. Si toca el stop, pierdes $100.","La pestaña 📐 Tamaño hace este cálculo por ti."],
["Apalancamiento","apal",["Permite operar con más dinero del que tienes. Multiplica las ganancias, pero también las pérdidas, y un movimiento pequeño puede liquidar tu cuenta."],"Con $1,000 y apalancamiento 10x controlas $10,000. Si el precio sube 5% ganas $500 (50% de tu capital); si baja 10%, pierdes $1,000: toda la cuenta.","Siendo principiante, evítalo. Primero aprende a ser rentable sin apalancamiento."],
["Psicología","",["Casi siempre los errores vienen de las emociones: miedo a perderse un movimiento, euforia tras ganar y rabia tras perder.","Un plan escrito y el checklist te ayudan a decidir con la cabeza fría."],"Pierdes $100 y quieres «recuperarlo» comprando el doble. Esa operación impulsiva suele terminar en otra pérdida mayor. Regla simple: tras 2 pérdidas seguidas, haz una pausa.","Si no puedes explicar tu razón en una frase, no entres."],
["Diario y revisión","",["Anota cada operación con su razón y una etiqueta (#soporte, #ruptura, #rsi). Cada semana revisa qué tipo de entrada te funciona y qué errores repites."],"Si tus entradas con #soporte ganan 60% y las de #noticia solo 20%, ya sabes dónde enfocarte.","Lo que no se mide no se mejora: usa Diario, Patrones y Stats."],
["Tipos de órdenes","",["<b>De mercado</b>: se ejecuta ya al precio actual. <b>Límite</b>: solo al precio que fijas o mejor. <b>Stop loss</b>: cierra si el precio va en tu contra hasta cierto nivel. <b>Take profit</b>: cierra al llegar a tu objetivo."],"BTC está en $65,000 y quieres comprar más barato: orden límite de compra en $64,000. Ya comprado, stop en $62,700 y take profit en $66,600 (relación 1:2).","Define stop y objetivo antes de entrar, no después."],
["Errores de principiante","",["• Operar demasiado.<br>• Usar apalancamiento alto.<br>• Seguir rumores o «señales» de otros.<br>• Mover el stop para no aceptar la pérdida.<br>• No llevar un registro."],"Si cambias el stop de $63,700 a $62,000 «para darle espacio», tu pérdida potencial pasa de $1,300 a $3,000 por BTC: más del doble.","Corregir un error por semana es un buen plan."],
["Plan de práctica","",["1) Elige BTC u oro y mira el gráfico de 30 o 90 días.<br>2) Identifica tendencia, soporte y resistencia.<br>3) Define entrada, stop y objetivo (mínimo 1:2).<br>4) Calcula el tamaño y regístralo en el simulador con tu razón y una etiqueta.<br>5) Cierra por stop u objetivo, no por emoción.<br>6) Revisa tus patrones cada semana."],"Meta inicial: 20–30 operaciones en el simulador o en 🎯 Práctica antes de sacar conclusiones.","Con pocas operaciones los porcentajes no dicen mucho: la constancia es lo que cuenta."],
["BTC y oro: qué cambia","",["BTC suele moverse mucho más que el oro. Eso da más oportunidades, pero también pérdidas más rápidas.","El oro tiende a ser más tranquilo y suele usarse como refugio en épocas de incertidumbre."],"Si en un día BTC se mueve 5% y el oro 1%, con $1,000 la diferencia es $50 contra $10.","Elige el activo según la volatilidad que puedes soportar y ajusta el tamaño a eso."],
["Horarios y liquidez","",["Cripto opera las 24 horas, todos los días. El oro físico (spot) opera casi todo el día de lunes a viernes. Las acciones, solo en horario de bolsa. El XAU de esta app sale de un token (PAXG) que se mueve las 24 horas.","Con poca liquidez (madrugada, fines de semana) los movimientos pueden ser bruscos y el spread más ancho."],"Dejas una compra abierta el viernes en un mercado con horario: el fin de semana puede haber un salto de precio sin que puedas reaccionar.","Antes de dejar una operación abierta, piensa en qué momento del día y de la semana estás."],
["Spread y comisiones","",["Cada operación tiene un costo: el spread (diferencia entre el precio de compra y el de venta) y a veces comisiones.","Si operas mucho, esos costos se comen tus ganancias aunque aciertes."],"Pagas $2 de costo por operación y haces 50: son $100. Si tu ganancia bruta fue $120, solo te quedaron $20.","Cuenta siempre los costos antes de decidir cuántas operaciones hacer."],
["Marcos temporales","tend",["El marco temporal es lo que representa cada vela: 1 hora, 4 horas, 1 día. Los marcos largos muestran la tendencia; los cortos, el momento de entrada.","Un movimiento que parece enorme en 1 hora puede ser un simple retroceso en el gráfico diario."],"El gráfico diario sube. En el de 1 hora hay una caída: no es una tendencia bajista, es un retroceso dentro de una subida.","Empieza por el marco largo y baja al corto solo para afinar la entrada."],
["Estructura: máximos y mínimos","tend",["La estructura es la secuencia de máximos y mínimos. Mientras cada mínimo sea más alto que el anterior, la subida sigue sana.","Cuando el precio pierde el último mínimo importante, la estructura se rompe y la tendencia puede estar cambiando."],"Mínimos en 60,000, 62,000 y 64,000: estructura alcista. Si luego cae a 63,000, el último mínimo (64,000) se rompió: señal de alerta.","Un stop justo debajo del último mínimo importante suele tener sentido."],
["Rupturas","sr",["Una ruptura ocurre cuando el precio cierra por encima de una resistencia (o debajo de un soporte) con fuerza.","Lo ideal es esperar el cierre de la vela, no entrar solo porque el precio la tocó."],"La resistencia está en 66,000. Una vela cierra en 66,500: ruptura. Entrada 66,600 con stop en 65,700, debajo de la zona rota.","Una ruptura necesita confirmación: cierre fuerte y, si hay datos, más volumen."],
["Rupturas falsas","sr",["A veces el precio supera una resistencia, atrae compradores y vuelve a caer por debajo. Se llama ruptura falsa.","Son comunes: por eso se espera el cierre y se usa stop."],"El precio sube a 66,300 y la vela cierra en 65,700, otra vez debajo de 66,000. Quien compró arriba queda atrapado.","Si el precio regresa dentro del rango, respeta el stop: no esperes que vuelva a romper."],
["Retrocesos (pullbacks)","tend",["En una tendencia alcista el precio sube y baja un poco antes de seguir. Esas bajadas cortas son retrocesos.","Comprar en un retroceso hacia un soporte o una media suele dar mejor relación riesgo/beneficio que comprar en el techo."],"El precio sube de 60,000 a 66,000 y baja a 64,000, donde hay soporte. Entrada 64,200 con stop en 63,500: arriesgas 700 y apuntas a 66,000 o más.","La paciencia de esperar el retroceso evita comprar caro."],
["Cruce de medias","media",["Cuando una media corta (por ejemplo la de 50) cruza por encima de una larga (la de 200) se llama cruz dorada. El cruce contrario es la cruz de la muerte.","Son señales lentas: confirman una tendencia, pero cuando aparecen ya pasó buena parte del movimiento."],"La media de 50 sube de 61,000 a 62,500 y cruza sobre la de 200, que está en 62,000: cruce alcista.","Úsalo para confirmar la dirección, no como única señal de entrada."],
["Media simple y exponencial","media",["La media simple trata todos los cierres igual. La exponencial (EMA) da más peso a los más recientes y reacciona más rápido.","Con una EMA de 9 periodos: EMA nueva = precio × 0.2 + EMA anterior × 0.8."],"EMA anterior 100 y precio actual 110: EMA nueva = 110×0.2 + 100×0.8 = 22 + 80 = 102.","Más rápida no significa mejor: reacciona antes, pero también da más señales falsas."],
["Volumen","",["El volumen es cuánto se negoció en un periodo. Un movimiento con mucho volumen suele tener más respaldo que uno con poco.","Una ruptura con volumen alto es más creíble que una con volumen bajo."],"El volumen promedio es 1,000 y la vela de ruptura marca 2,200: más del doble, así que la ruptura tiene más respaldo.","El volumen confirma; por sí solo no te dice hacia dónde irá el precio."],
["Velas de rechazo (martillo)","vela",["Una vela con mecha muy larga y cuerpo pequeño muestra que el precio fue empujado y rechazado. Si la mecha apunta hacia abajo en un soporte, se llama martillo.","Indica que los compradores defendieron esa zona."],"BTC cae a 59,000 pero cierra en 60,300 tras abrir en 60,000: cuerpo de 300 y mecha inferior de 1,000, sobre un soporte.","Ninguna vela es señal por sí sola: busca que coincida con una zona importante."],
["Vela envolvente","vela",["Una envolvente alcista es una vela verde cuyo cuerpo cubre por completo el cuerpo de la vela roja anterior.","Sugiere que los compradores tomaron el control, sobre todo si aparece en un soporte tras una caída."],"Vela roja: abre 100 y cierra 98. Vela verde siguiente: abre 97.5 y cierra 101. Su cuerpo cubre el de la roja.","Confírmala con el contexto: soporte, tendencia y un stop definido."],
["Doji e indecisión","vela",["Un doji es una vela cuya apertura y cierre casi coinciden: el cuerpo es diminuto.","Muestra indecisión; tras un gran movimiento puede avisar de una pausa o de un cambio."],"Abre 100.00, sube a 102, baja a 98 y cierra en 100.10: cuerpo de 0.10 y mechas largas a ambos lados.","No operes solo por un doji: espera a ver qué hace la siguiente vela."],
["Doble techo y doble suelo","sr",["El doble techo ocurre cuando el precio toca dos veces la misma resistencia y no la supera; el doble suelo es lo contrario en un soporte.","La señal se confirma al romper el nivel intermedio (la línea de cuello)."],"Dos techos en 66,000 y un valle en 63,000. Si rompe 63,000, el objetivo estimado es 63,000 − (66,000 − 63,000) = 60,000.","El objetivo es solo una estimación: pon siempre un stop."],
["Mercados laterales","sr",["En un rango el precio rebota entre un soporte y una resistencia. Se compra cerca del soporte y se vende cerca de la resistencia.","El peligro es la ruptura del rango: el stop debe quedar fuera de él."],"Rango entre 62,000 y 66,000. Entrada 62,200, stop 61,500 (riesgo 700), objetivo 64,000 (beneficio 1,800): relación de casi 1:2.6.","Si el rango se rompe, la estrategia de rebotes deja de funcionar: sal."],
["Divergencias del RSI","rsi",["Hay divergencia cuando el precio hace un nuevo máximo pero el RSI hace uno más bajo. Sugiere que el impulso se debilita.","Es una advertencia, no una orden de vender."],"El precio llega a 66,000 con RSI 75 y luego a 67,000 con RSI 68: nuevo máximo de precio, pero con menos fuerza.","Combínala con una resistencia o una vela de rechazo antes de actuar."],
["MACD básico","media",["El MACD resta una media exponencial de 26 periodos a una de 12. Su línea de señal es una media de 9 periodos del propio MACD.","Cuando el MACD cruza por encima de su señal suele indicar impulso alcista; por debajo, bajista."],"MACD en −50 y señal en −40: el MACD está debajo. Pasa a −35 mientras la señal queda en −38: cruzó hacia arriba.","Como la media móvil, llega con retraso: confirma, no predice."],
["Bandas de Bollinger","media",["Son una media móvil de 20 periodos con dos bandas a 2 desviaciones estándar por encima y por debajo.","Cuando las bandas se estrechan hay poca volatilidad; cuando se abren, el precio se mueve fuerte."],"Media de 20 = 100 y desviación = 2: banda superior 104 y banda inferior 96.","Tocar una banda no es señal de giro: en tendencias fuertes el precio puede «caminar» sobre ella."],

["Esperanza matemática","riesgo",["Es lo que ganas en promedio por operación: aciertos × ganancia promedio − fallos × pérdida promedio.","Si es positiva, tu método gana a largo plazo aunque pierdas muchas veces."],"Aciertos 40%, ganancia 2R, pérdida 1R: 0.4×2 − 0.6×1 = +0.2R por operación. Con R = $100 y 100 operaciones: unos +$2,000.","Con pocas operaciones domina la suerte: necesitas decenas para ver la realidad."],
["Rachas de pérdidas","",["Aunque tu método sea bueno, las rachas perdedoras son normales.","Con 40% de aciertos, la probabilidad de perder 5 seguidas en un momento dado es 0.6×0.6×0.6×0.6×0.6 ≈ 7.8%."],"En 100 operaciones es muy probable ver una racha de 6 o más pérdidas. Con riesgo de 1% sigues vivo; con 10%, pierdes casi la mitad de la cuenta.","Prueba la pestaña 🧪 Riesgo para ver tus propias rachas."],
["Drawdown","",["Es la caída de tu capital desde su máximo. Mide cuánto aguantas por el camino.","Perder 20% exige ganar 25% para recuperarte; perder 50% exige ganar 100%."],"Un capital de $10,000 que baja a $8,000 (−20%) necesita subir $2,000, es decir 25%, para volver a $10,000.","Tu primer objetivo no es ganar rápido, sino mantener el drawdown pequeño."],
["Diversificación y correlación","",["No es poner el dinero en muchas cosas, sino en cosas que no se muevan igual. Varias criptos suelen subir y bajar juntas.","Tres compras de criptos distintas pueden comportarse como una sola gran apuesta."],"Compras tres criptos arriesgando 1% en cada una. Si el mercado cae, las tres pueden tocar el stop: pierdes cerca de 3%, no 1%.","Cuenta el riesgo de ideas relacionadas como una sola operación."],
["Riesgo total abierto","",["Además del riesgo por operación, limita el riesgo de todas las posiciones abiertas a la vez.","Una regla común es no pasar de 5% o 6% del capital en riesgo al mismo tiempo."],"Capital $10,000. Tres operaciones abiertas con riesgo de $100, $100 y $150: $350 en total = 3.5%. Aún hay espacio para otra pequeña.","Revisa el riesgo total antes de cada nueva entrada."],
["Tu plan de trading","",["Un plan escrito decide por ti cuando hay emociones. Debe incluir qué activos operas, qué señal buscas, cuánto arriesgas, cuándo no operas y tus límites diarios.","Se mejora con el diario, no con intuiciones sueltas."],"Plan: operar BTC y oro; entrar solo en soporte con tendencia alcista; riesgo 1%; máximo 3 operaciones al día; parar tras 2 pérdidas seguidas.","Escribe tu plan en 🛡️ Disciplina → Mis reglas personales."],
["Sobreoperar","",["Operar sin una buena razón, por aburrimiento o ansiedad, es una de las formas más comunes de perder.","Más operaciones significan más costos y más oportunidades de cometer errores."],"Si haces 10 operaciones al día pero solo 2 cumplen tu plan, las otras 8 son ruido que cuesta dinero y atención.","Menos operaciones, de mejor calidad. No operar también es una decisión."],

["Operar por venganza","",["Después de una pérdida, la rabia te empuja a entrar rápido para recuperarla. Casi siempre rompe tus reglas.","La pérdida ya ocurrió: el mercado no te debe nada."],"Pierdes $100 a las 10:00 y a las 10:05 entras con el doble sin plan. Pierdes $200: la pérdida creció por la emoción.","Regla útil: tras dos pérdidas seguidas, pausa de al menos una hora."],
["Práctica en datos pasados","",["Practicar con velas pasadas te permite hacer muchas operaciones en poco tiempo y ver qué habría pasado después.","Debes decidir con la información disponible, sin mirar adelante."],"En 🎯 Práctica haces 30 operaciones en una tarde, con stop y objetivo definidos, y revisas qué errores se repiten.","Anota tus resultados: con 30 o más operaciones empiezas a ver patrones reales."],
["Métricas de tu diario","",["Las métricas básicas son: porcentaje de aciertos, ganancia y pérdida promedio y esperanza por operación.","Mide por separado el proceso (seguiste tu plan) y el resultado (ganaste)."],"20 operaciones: 8 ganan 2R de promedio y 12 pierden 1R. Esperanza = (8×2 − 12×1) ÷ 20 = +0.2R por operación.","Una operación mal ejecutada que gana por suerte sigue siendo una mala operación."],
["Estafas y seguridad","",["Desconfía de quien promete ganancias fijas, de los grupos de «señales seguras» y de quien te pide depositar dinero para «multiplicarlo».","Nunca compartas tu clave, tu código de verificación ni las 12 o 24 palabras de tu billetera."],"Te ofrecen 10% semanal «garantizado». Compuesto durante un año serían 1.1^52 ≈ 142 veces tu dinero. Nadie puede garantizar algo así.","Si suena demasiado bueno para ser verdad, probablemente lo sea."],
["Del simulador al dinero real","",["Antes de usar dinero real: al menos 50 operaciones, esperanza positiva y varias semanas respetando tus reglas.","Si das el paso, empieza con una cantidad pequeña que puedas perder sin que te afecte."],"Con una cuenta real de $200 y riesgo de 1%, cada operación arriesga $2. Es poco, pero te enseña a manejar emociones reales.","Verifica qué plataformas están disponibles y son legales para ti, y desconfía de las que no tengan reglas claras."]

const med=a=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
const pc=(a,q)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(q*(s.length-1))]};
function simRachas(w,rr,rk,n,runs){
  const fin=[],dd=[],ml=[],cur=[];
  for(let r=0;r<runs;r++){
    let c=1,pk=1,d=0,l=0,m=0;const k=r<25?[1]:null;
    for(let i=0;i<n;i++){
      if(Math.random()<w/100){c*=1+rk/100*rr;l=0}else{c*=1-rk/100;l++;m=Math.max(m,l)}
      pk=Math.max(pk,c);d=Math.max(d,1-c/pk);if(k)k.push(c);
    }
    fin.push(c);dd.push(d);ml.push(m);if(k)cur.push(k);
  }
  return{fin,dd,ml,cur};
}
function rlIn(){
  const g=(id,a,b,d)=>Math.min(b,Math.max(a,+$(id).value||d));
  return[g('rl_w',1,99,40),g('rl_rr',.1,20,2),g('rl_rk',.1,50,1),Math.round(g('rl_n',10,500,100))];
}
function curvas(cv,cur){
  const W=cv.clientWidth,H=cv.clientHeight,r=devicePixelRatio||1;cv.width=W*r;cv.height=H*r;
  const x=cv.getContext('2d');x.scale(r,r);
  const all=cur.flat(),hi=Math.max(...all),lo=Math.min(...all,1),R=hi-lo||1,Y=v=>H-6-(v-lo)/R*(H-12);
  x.strokeStyle='#888';x.globalAlpha=.6;x.setLineDash([4,4]);x.beginPath();x.moveTo(0,Y(1));x.lineTo(W,Y(1));x.stroke();x.setLineDash([]);
  cur.forEach(k=>{x.globalAlpha=.55;x.strokeStyle=k[k.length-1]>=1?'#16a34a':'#dc2626';x.beginPath();
    k.forEach((v,i)=>{const X=i*W/(k.length-1);i?x.lineTo(X,Y(v)):x.moveTo(X,Y(v))});x.stroke()});
}

<div class="row"><span>Racha de pérdidas (típica / máxima)</span><b>${med(S.ml)} / ${Math.max(...S.ml)}</b></div></div>
<div class="mut">R = lo que arriesgas en una operación. Una esperanza positiva no evita las rachas malas: por eso se arriesga poco.</div>`;
