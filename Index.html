<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tutor de Trading</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
--bg:var(--tg-theme-bg-color,#fff);
--tx:var(--tg-theme-text-color,#111);
--mut:var(--tg-theme-hint-color,#7a7a7a);
--bt:var(--tg-theme-button-color,#2481cc);
--bx:var(--tg-theme-button-text-color,#fff);
--card:var(--tg-theme-secondary-bg-color,#f0f2f5);
--up:#16a34a;
--dn:#dc2626;
box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px)
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--tx);
font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}

nav{
display:flex;
gap:6px;
padding:10px;
position:sticky;
top:0;
background:var(--bg);
z-index:2;
overflow-x:auto
}

nav button,.seg button{
flex:1 0 auto;
border:0;
border-radius:10px;
padding:9px 12px;
background:var(--card);
color:var(--tx);
font:inherit;
font-size:13px;
white-space:nowrap
}

nav button.on,.seg button.on{
background:var(--bt);
color:var(--bx)
}

main{
padding:0 12px 24px;
max-width:640px;
margin:auto
}

.panel{display:none}
.panel.on{display:block}

.seg{
display:flex;
gap:6px;
margin:8px 0
}

.card{
background:var(--card);
border-radius:12px;
padding:12px;
margin:10px 0
}

.precio{
font-size:26px;
font-weight:700
}

.up{color:var(--up)}
.dn{color:var(--dn)}
.mut{
color:var(--mut);
font-size:12px
}

canvas{
width:100%;
height:260px;
display:block
}

label{
display:block;
margin:8px 0 2px;
font-size:13px;
color:var(--mut)
}

[hidden]{display:none!important}

.row{
display:flex;
justify-content:space-between;
gap:8px;
padding:6px 0;
border-bottom:1px solid var(--bg)
}

.mini{
border:0;
border-radius:8px;
padding:4px 10px;
background:var(--bt);
color:var(--bx);
font:inherit;
font-size:12px
}

input:not([type=checkbox]){
width:100%;
padding:10px;
border-radius:10px;
border:1px solid var(--mut);
background:var(--bg);
color:var(--tx);
font:inherit
}

.btn{
width:100%;
margin-top:10px;
border:0;
border-radius:10px;
padding:11px;
background:var(--bt);
color:var(--bx);
font:inherit
}

.res div{
display:flex;
justify-content:space-between;
padding:4px 0
}

.chk{
display:flex;
gap:10px;
align-items:flex-start;
padding:9px 0
}

.chk input{
width:20px;
height:20px;
margin-top:2px
}

dt{
font-weight:600;
margin-top:10px
}

dd{
margin:2px 0 0;
color:var(--mut)
}

.edu-opcion:disabled{
opacity:.75
}
</style>
</head>

<body>

<nav id="tabs">
<button data-p="graf" class="on">📈 Gráfico</button>
<button data-p="sim">💼 Simulador</button>
<button data-p="calc">📐 Tamaño</button>
<button data-p="chk">✅ Checklist</button>
<button data-p="glo">📖 Glosario</button>
<button data-p="edu">📚 Aprender</button>
</nav>

<main>

<!-- =========================================================
GRÁFICO
========================================================= -->

<section id="graf" class="panel on">

<div class="seg" id="activos">
<button data-a="BTC" class="on">BTC</button>
<button data-a="XAU">Oro (XAU)</button>
</div>

<div class="seg" id="rangos">
<button data-d="1">1d</button>
<button data-d="7">7d</button>
<button data-d="30" class="on">30d</button>
<button data-d="90">90d</button>
</div>

<div class="card">

<div class="precio" id="px">…</div>

<div id="chg" class="mut"></div>

<canvas id="cv"></canvas>

<div id="estado" class="mut"></div>

</div>

<div class="mut">
El oro se calcula con PAXG (oro tokenizado): es una referencia aproximada.
Confirma el precio antes de registrar tu operación.
</div>

</section>

<!-- =========================================================
SIMULADOR
========================================================= -->

<section id="sim" class="panel">

<div class="card" id="s_res"></div>

<div class="seg" id="sub">
<button data-s="op" class="on">Operar</button>
<button data-s="dia">Diario</button>
<button data-s="pat">Patrones</button>
</div>

<div id="s_op">

<div class="card">

<label>Activo</label>

<input id="s_sym" list="activos_l" value="BTC">

<datalist id="activos_l">
<option value="BTC">
<option value="XAU">
</datalist>

<label>Cantidad</label>
<input id="s_cant" type="number" inputmode="decimal">

<label>Precio</label>
<input id="s_px" type="number" inputmode="decimal">

<button
class="btn"
id="s_usar"
style="background:var(--bg);color:var(--tx);border:1px solid var(--mut)">
Usar precio actual
</button>

<label>
Razón (con etiquetas: #ruptura #soporte #rsi)
</label>

<input id="s_raz" type="text">

<div style="display:flex;gap:8px">

<button
class="btn"
id="s_buy"
style="background:var(--up)">
Comprar
</button>

<button
class="btn"
id="s_sell"
style="background:var(--dn)">
Vender
</button>

</div>

<div
id="s_msg"
class="mut"
style="margin-top:8px">
</div>

</div>

<div class="card" id="s_pos"></div>

<button
class="btn"
id="s_reset"
style="background:var(--card);color:var(--dn)">
Reiniciar simulador
</button>

</div>

<div id="s_dia" hidden></div>
<div id="s_pat" hidden></div>

</section>

<!-- =========================================================
CALCULADORA
========================================================= -->

<section id="calc" class="panel">

<div class="card">

<label>Capital ($`)</label>
<input id="cap" type="number" inputmode="decimal" value="10000">

<label>Riesgo por operación (%)</label>
<input id="rie" type="number" inputmode="decimal" value="1">

<label>Precio de entrada</label>
<input id="ent" type="number" inputmode="decimal">

<label>Stop loss (debajo de la entrada)</label>
<input id="stp" type="number" inputmode="decimal">

<button class="btn" id="usar">
Usar el precio actual como entrada
</button>

</div>

<div class="card res" id="res">
<span class="mut">
Escribe entrada y stop para calcular.
</span>
</div>

</section>

<!-- =========================================================
CHECKLIST
========================================================= -->

<section id="chk" class="panel">

<div class="card" id="lista"></div>

<div class="card" id="veredicto"></div>

<button class="btn" id="reset">
Reiniciar checklist
</button>

</section>

<!-- =========================================================
GLOSARIO
========================================================= -->

<section id="glo" class="panel">

<input
id="buscar"
type="search"
placeholder="Buscar término…">

<dl id="terminos"></dl>

</section>

<!-- =========================================================
APRENDER
========================================================= -->

<section id="edu" class="panel">

<div class="card">

<h2 style="margin:0 0 6px">
📚 Trading Aprendiz
</h2>

<div class="mut">
Aprende los conceptos básicos y comprueba lo que has aprendido.
</div>

<div class="row">
<span>Progreso</span>
<b id="edu_progreso">0%</b>
</div>

<div class="row">
<span>Lecciones completadas</span>
<b id="edu_completadas">0/6</b>
</div>

</div>

<div id="edu_lista"></div>

<div id="edu_leccion" hidden></div>

<div id="edu_quiz" hidden></div>

<button
class="btn"
id="edu_reset"
style="background:var(--card);color:var(--dn)">
Reiniciar progreso
</button>

</section>

</main>

<script>

/* =========================================================
TELEGRAM
========================================================= */

const `$=id=>document.getElementById(id);

const tg=
window.Telegram &&
window.Telegram.WebApp;

if(tg){
try{
tg.ready();
tg.expand();
}catch(e){}
}

/* =========================================================
ALMACENAMIENTO
========================================================= */

const store={

get(k){
try{
return JSON.parse(localStorage.getItem(k))
}catch(e){
return null
}
},

set(k,v){
try{
localStorage.setItem(k,JSON.stringify(v))
}catch(e){}
}

};

/* =========================================================
FORMATO
========================================================= */

const f=(n,d)=>
Number(n).toLocaleString(
'en-US',
{
maximumFractionDigits:
d??(Math.abs(n)<10?4:2)
}
);

/* =========================================================
PESTAÑAS
========================================================= */

$`('tabs').onclick=e=>{

const p=e.target.dataset.p;

if(!p)return;

document
.querySelectorAll('nav button,.panel')
.forEach(x=>x.classList.remove('on'));

e.target.classList.add('on');

`$(p).classList.add('on');

if(p==='graf')dibujar();

if(p==='sim')pintarSim();

if(p==='edu')pintarEdu();

};

/* =========================================================
GRÁFICO
========================================================= */

const IDS={
BTC:'bitcoin',
XAU:'pax-gold'
};

let activo='BTC';
let dias=30;
let datos=[];

function seg(id,attr,fn){

$`(id).onclick=e=>{

const v=e.target.dataset[attr];

if(!v)return;

`$(id)
.querySelectorAll('button')
.forEach(b=>b.classList.remove('on'));

e.target.classList.add('on');

fn(v);
cargar();

};

}

seg('activos','a',v=>activo=v);

seg('rangos','d',v=>dias=+v);

async function cargar(){

const k=ohlc_${activo}_${dias};
const c=store.get(k);

let hora;
let viejo=false;

if(c&&Date.now()-c.t<600000){

datos=c.d;
hora=c.t;

}else{

$`('estado').textContent='Cargando…';

try{

const r=await fetch(
https://api.coingecko.com/api/v3/coins/${IDS[activo]}/ohlc?vs_currency=usd&days=${dias}
);

if(!r.ok)
throw new Error(r.status);

datos=await r.json();

hora=Date.now();

store.set(k,{
t:hora,
d:datos
});

}catch(e){

if(c){

datos=c.d;
hora=c.t;
viejo=true;

}else{

datos=[];

$('px').textContent='Sin datos'; $('chg').textContent='';
`$('estado').textContent=
'No se pudo conectar. Inténtalo más tarde.';

dibujar();

return;

}

}

}

const h=
new Date(hora)
.toLocaleTimeString(
'es',
{
hour:'2-digit',
minute:'2-digit'
}
);

{h}:Actualizado ${h};

const ult=
datos[datos.length-1][4];

const ini=
datos[0][1];

const ch=
(ult-ini)/ini*100;

$('px').textContent='$'+f(ult);

$('chg').innerHTML=
<span class="{ch>=0?'▲':'▼'} {dias===1?'24 horas':dias+' días'}
`;

dibujar();

}

function dibujar(){

const cv=$`('cv');

const W=cv.clientWidth;
const H=cv.clientHeight;

if(!W)return;

const dpr=
window.devicePixelRatio||1;

cv.width=Wdpr;
cv.height=Hdpr;

const x=cv.getContext('2d');

x.scale(dpr,dpr);
x.clearRect(0,0,W,H);

if(!datos.length)return;

const mut=
getComputedStyle(document.documentElement)
.getPropertyValue('--mut')
.trim()||'#888';

const pad={
l:4,
r:58,
t:8,
b:8
};

let hi=
Math.max(...datos.map(c=>c[2]));

let lo=
Math.min(...datos.map(c=>c[3]));

const m=(hi-lo)*.06||1;

hi+=m;
lo-=m;

const Y=v=>
pad.t+
(hi-v)/(hi-lo)*
(H-pad.t-pad.b);

x.font='11px system-ui';

x.fillStyle=mut;
x.strokeStyle=mut;
x.globalAlpha=.25;

for(let i=0;i<=4;i++){

const v=
lo+(hi-lo)*i/4;

const y=Y(v);

x.beginPath();
x.moveTo(pad.l,y);
x.lineTo(W-pad.r,y);
x.stroke();

x.globalAlpha=1;

x.fillText(
f(v,v<10?3:0),
W-pad.r+4,
y+4
);

x.globalAlpha=.25;

}

x.globalAlpha=1;

const cw=
(W-pad.l-pad.r)/datos.length;

datos.forEach((c,i)=>{

const [,o,h,l,cl]=c;

const px=
pad.l+i*cw+cw/2;

const col=
cl>=o?'#16a34a':'#dc2626';

x.strokeStyle=
x.fillStyle=col;

x.beginPath();

x.moveTo(px,Y(h));
x.lineTo(px,Y(l));

x.stroke();

const top=
Y(Math.max(o,cl));

const bh=
Math.max(
1,
Math.abs(Y(o)-Y(cl))
);

x.fillRect(
px-cw*.35,
top,
cw*.7,
bh
);

});

}

window.addEventListener(
'resize',
dibujar
);

/* =========================================================
SIMULADOR
========================================================= */

const CAP0=10000;

const nuevoSim=()=>({
cash:CAP0,
pos:{},
hist:[],
ganadas:0,
perdidas:0,
pnl:0,
diario:[],
etiquetas:{}
});

let sim=
store.get('sim')||
nuevoSim();

const guardar=()=>
store.set('sim',sim);

const ahora=()=>
new Date().toLocaleString(
'es',
{
day:'2-digit',
month:'2-digit',
hour:'2-digit',
minute:'2-digit'
}
);

const cls=n=>
n>=0?'up':'dn';

const sg=n=>
(n>=0?'+':'-')+
'`$'+
f(Math.abs(n));

const esc=s=>
String(s).replace(
/[&<>"]/g,
c=>({
'&':'&',
'<':'<',
'>':'>',
'"':'"'
}[c])
);

const confirmar=(t,fn)=>{

try{

if(tg&&tg.showConfirm)
return tg.showConfirm(
t,
ok=>ok&&fn()
);

}catch(e){}

if(confirm(t))
fn();

};

async function precios(){

const c=store.get('precios');

if(c&&Date.now()-c.t<120000)
return c.v;

try{

const r=await fetch(
'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,pax-gold&vs_currencies=usd'
);

if(!r.ok)
throw 0;

const j=await r.json();

const v={
BTC:j.bitcoin.usd,
XAU:j['pax-gold'].usd
};

store.set(
'precios',
{
t:Date.now(),
v
}
);

return v;

}catch(e){

return c?c.v:{};

}

}

async function pintarSim(){

const p=await precios();

let val=0;
let flot=0;
let filas='';

for(
const [s,x]
of Object.entries(sim.pos)
){

const px=p[s];

const fl=
px
?(px-x.prom)*x.cant
:null;

val+=
x.cant*(px||x.prom);

if(fl!==null)
flot+=fl;

filas+=`
<div class="row">

<span>
<b>{+x.cant.toPrecision(6)}

<br>

<span class="mut">
prom {px?' · ahora $`'+f(px):''}
</span>

</span>

<span style="text-align:right">

${ fl!==null ?
<b class="{sg(fl)}
</b>
<br>
`
:''
}

<button
class="mini"
data-v="$`{esc(s)}">
Vender
</button>

</span>

</div>
`;

}

const n=
sim.ganadas+
sim.perdidas;

$('s_res').innerHTML=

<div class="row">
<span>Efectivo</span>
<b>$`{f(sim.cash)}</b>
</div>

<div class="row">
<span>Posiciones</span>
<b>`${f(val)}</b>
</div>

<div class="row">
<span>Capital total</span>
<b>$`{f(sim.cash+val)}</b>
</div>

<div class="row">
<span>Ganancia flotante</span>
<b class="${cls(flot)}"&gt; ${sg(flot)}
</b>
</div>

<div class="row">
<span>Resultado cerrado</span>
<b class="${cls(sim.pnl)}"&gt; ${sg(sim.pnl)}
</b>
</div>

<div class="row">
<span>Aciertos</span>
<b>
${ n ?{n} (${Math.round(100*sim.ganadas/n)}%)
:'—'
}
</b>
</div>

`;

$('s_pos').innerHTML= filas ?<b>Posiciones abiertas</b>${filas}
:'<span class="mut">No tienes posiciones abiertas.</span>';

}

function operar(tipo){

const sym=
`$('s_sym').value
.trim()
.toUpperCase();

const cant=
+$`('s_cant').value;

const px=
+`$('s_px').value;

const razon=
$`('s_raz').value.trim();

const m=`$('s_msg');

const err=t=>{
m.className='dn';
m.textContent=t;
};

if(
!sym||
!(cant>0)||
!(px>0)
)
return err(
'Completa activo, cantidad y precio.'
);

m.className='mut';

if(tipo==='COMPRA'){

const costo=
cant*px;

if(costo>sim.cash)
return err(
Te faltan fondos: necesitas ${f(costo)} y tienes ${f(sim.cash)}.
);

const p=
sim.pos[sym]||
{
cant:0,
prom:0,
razon:''
};

const tot=
p.cant+cant;

p.prom=
(p.cantp.prom+cantpx)/tot;

p.cant=tot;

if(razon)
p.razon=razon;

sim.pos[sym]=p;

sim.cash-=costo;

sim.hist.push(
COMPRA ${cant} ${sym} a ${f(px)}`
);

sim.diario.push({
f:ahora(),
tipo,
sym,
cant,
precio:px,
razon
});

m.textContent=
✅ Compraste${cant} {f(px)}`;

}else{

const p=sim.pos[sym];

if(
!p||
p.cant<cant-1e-9
)
return err(
No tienes suficiente ${sym}. Tienes ${p?+p.cant.toPrecision(6):0}.
);

const g=
(px-p.prom)*cant;

const entrada=
p.razon||'';

sim.cash+=cant*px;

sim.pnl+=g;

p.cant-=cant;

if(p.cant<1e-9)
delete sim.pos[sym];

sim[
g>=0
?'ganadas'
:'perdidas'
 ]++;

const tags=[
...new Set(
entrada
.toLowerCase()
.match(/#\w+/g)||
['#sin_etiqueta']
)
];

tags.forEach(t=>{

const e=
sim.etiquetas[t]||
{
n:0,
g:0,
pnl:0
};

e.n++;

e.g+=
g>=0?1:0;

e.pnl+=g;

sim.etiquetas[t]=e;

});

sim.hist.push(
VENTA ${cant} ${sym} a ${f(px)} (${sg(g)})
);

sim.diario.push({
f:ahora(),
tipo,
sym,
cant,
precio:px,
razon,
entrada,
pnl:g
});

m.innerHTML=
${g>=0?'🟢':'🔴'} Vendiste ${cant} ${esc(sym)}. Resultado: <b class="${cls(g)}"&gt;${sg(g)}</b>`;

}

guardar();
pintarSim();

}

function pintarDiario(){

const d=
sim.diario
.slice(-30)
.reverse();

$('s_dia').innerHTML= d.length ?d.map(e=>

<div class="card">

<b>
{e.tipo}
{esc(e.sym)}
</b>

@ $`{f(e.precio)}

${ e.pnl!==undefined ?
<b class="{sg(e.pnl)}
</b>
`
:''
}

<div class="mut">
$`{e.f}
</div>

${ e.entrada ?
<div>
➡️ Entrada:
${esc(e.entrada)} &lt;/div&gt;
:''
}

${ e.razon ?
<div>
{esc(e.razon)}
</div>
`
:''
}

</div>

).join('') :
<div class="card mut">
Tu diario está vacío.
Opera con una razón y una etiqueta,
por ejemplo:
rebote en soporte #soporte
</div>
`;

}

function pintarPat(){

const t=
Object.entries(sim.etiquetas)
.sort(
(a,b)=>
b[1].pnl-
a[1].pnl
);

$('s_pat').innerHTML= t.length ?
<div class="card">

${ t.map( ([k,e])=>

<div class="row">

<span>

<b>$`{esc(k)}</b>

<br>

<span class="mut">
${e.n} ventas · ${e.g} ganadas
(`${Math.round(100*e.g/e.n)}%)
</span>

</span>

<b class="{sg(e.pnl)}
</b>

</div>

`
).join('')
}

</div>

<div class="mut">
Con pocas operaciones estos números
no son concluyentes.
</div>
:
<div class="card mut">
Aún no hay datos.
Compra con etiquetas
(#ruptura, #rsi…)
y, cuando vendas, aquí verás qué
tipo de entrada registraste.
</div>
`;

}

$`('sub').onclick=e=>{

const s=e.target.dataset.s;

if(!s)return;

`$('sub')
.querySelectorAll('button')
.forEach(
b=>b.classList.remove('on')
);

e.target.classList.add('on');

['op','dia','pat']
.forEach(
k=>$`('s_'+k).hidden=k!==s
);

if(s==='dia')
pintarDiario();

if(s==='pat')
pintarPat();

};

`$('s_buy').onclick=
()=>operar('COMPRA');

$`('s_sell').onclick=
()=>operar('VENTA');

`$('s_usar').onclick=async()=>{

const v=
(await precios())[
$`('s_sym')
.value
.trim()
.toUpperCase()
 ];

const m=`$('s_msg');

if(v){

$`('s_px').value=v;

m.className='mut';

function calcular(){

const cap=+$('cap').value; const rp=+$('rie').value;
const en=+$('ent').value; const st=+$('stp').value;

const r=`$('res');

if(
!(cap>0&&rp>0&&en>0&&st>0)
){

r.innerHTML=
'<span class="mut">Escribe entrada y stop para calcular.</span>';

return;
}

if(st>=en){

r.innerHTML=
'<span class="dn">El stop debe estar por debajo de la entrada.</span>';

return;
}

const riesgo=
cap*rp/100;

const dist=
en-st;

const cant=
riesgo/dist;

const costo=
cant*en;

let h=`

<div>
<span>Riesgo</span>
<b>$`{f(riesgo)}</b>
</div>

<div>
<span>Pérdida por unidad</span>
<b>`${f(dist)}</b>
</div>

<div>
<span>Compra</span>
<b>$`{+cant.toPrecision(5)} unidades</b>
</div>

<div>
<span>Costo</span>
<b>`${f(costo)}</b>
</div>

<div>
<span>Objetivo 1:2</span>
<b class="up">$`{f(en+2*dist)}</b>
</div>

<div>
<span>Objetivo 1:3</span>
<b class="up">`${f(en+3*dist)}</b>
</div>

`;

if(costo>cap)
h+=&lt;p class="dn"&gt; Ese tamaño cuesta más que tu capital. &lt;/p&gt;;

if(rp>2)
h+=&lt;p class="dn"&gt; Más de 2% por operación es mucho riesgo. &lt;/p&gt;;

r.innerHTML=h;

}

['cap','rie','ent','stp']
.forEach(
i=>$`(
i
).oninput=calcular
);

$`('ent').value=
datos[
datos.length-1
 ][4];

calcular();

}
